# The batteries-included consumer path: wires context -> verdict -> propagate.
#
# The three action references below are hardcoded to this repository, because a
# reusable workflow cannot interpolate its own repository into a `uses:`
# reference. If this repo is ever renamed or forked, they need updating here and
# in README.md and GUIDE.md.
#
# Two entry points, one pipeline:
#
#   workflow_run         a CI run finished, so there may be a new verdict to
#                        establish and propagate down a segment.
#   pull_request_target  something structural changed (a checkpoint label, a
#                        draft transition, a merge, stack membership) without any
#                        CI running. The verdict is re-derived from the checks
#                        already on record. `pull_request_target` rather than
#                        `pull_request` because a fork PR's `pull_request` token
#                        is read-only and could not post the check at all.
#
# Security: this workflow runs in the base-repo context with a write-capable
# token and is reachable from fork PRs. It never checks out or executes any code
# from the pull request under evaluation — it reads metadata only.
name: Stack Optimization Gate

on:
  workflow_call:
    # These inputs deliberately carry NO defaults. An action input always beats
    # the repository config file, so a default here would be forwarded as a real
    # value and would silently override the config file. For check-name that is
    # catastrophic: the gate would write the default name while branch
    # protection waited for the configured one, blocking every PR forever.
    #
    # Left unset, these arrive as empty strings, which the actions treat as
    # absent. The config file is then honoured, and the built-in defaults apply
    # when there is no config file.
    inputs:
      check-name:
        description: 'Gate check run name. This is the name branch protection requires. Overrides the config file. Default: stack-optimization.'
        type: string
        required: false
      checkpoint-label:
        description: 'Label marking a PR as a checkpoint. Overrides the config file. Default: stack-checkpoint.'
        type: string
        required: false
      config-path:
        description: 'Repository config file, read from the default branch. Default: .github/stack-optimization.yml.'
        type: string
        required: false
      dry-run:
        description: 'Log the plan without writing any check runs.'
        type: boolean
        required: false
        default: false
    secrets:
      token:
        description: 'Overrides GITHUB_TOKEN. See the recursion warning in the README.'
        required: false

permissions:
  checks: write
  pull-requests: read
  actions: read
  contents: read

jobs:
  gate:
    # A cancelled CI run proves nothing, so there is no verdict to compute.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve stack topology
        id: context
        uses: samishal1998/stack-optimization/actions/context@v1
        with:
          token: ${{ secrets.token || github.token }}
          checkpoint-label: ${{ inputs.checkpoint-label }}
          config-path: ${{ inputs.config-path }}

      - name: Compute verdict plan
        id: verdict
        uses: samishal1998/stack-optimization/actions/verdict@v1
        with:
          token: ${{ secrets.token || github.token }}
          context: ${{ steps.context.outputs.context }}
          # Absent on a pull_request event, which is what selects reconcile mode.
          conclusion: ${{ github.event.workflow_run.conclusion }}
          run-id: ${{ github.event.workflow_run.id }}
          run-url: ${{ github.event.workflow_run.html_url }}
          check-name: ${{ inputs.check-name }}
          config-path: ${{ inputs.config-path }}

      - name: Post check runs
        if: steps.verdict.outputs.affected-count != '0'
        uses: samishal1998/stack-optimization/actions/propagate@v1
        with:
          token: ${{ secrets.token || github.token }}
          plan: ${{ steps.verdict.outputs.plan }}
          check-name: ${{ steps.verdict.outputs.check-name }}
          dry-run: ${{ inputs.dry-run }}
