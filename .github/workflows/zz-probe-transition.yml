name: Probe status transition
on: workflow_dispatch
permissions:
  checks: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can a completed check run be walked back to in_progress?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA=${{ github.sha }}
          ID=$(gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f name=probe-transition -f head_sha=$SHA -f status=completed -f conclusion=success \
            --jq .id)
          echo "created completed check $ID"
          gh api "repos/${{ github.repository }}/check-runs/$ID" --jq '"before: status=\(.status) conclusion=\(.conclusion)"'

          echo "--- PATCH status=in_progress ---"
          gh api --method PATCH "repos/${{ github.repository }}/check-runs/$ID" \
            -f status=in_progress 2>&1 | head -5 || echo "PATCH errored"
          gh api "repos/${{ github.repository }}/check-runs/$ID" --jq '"after in_progress: status=\(.status) conclusion=\(.conclusion)"'

          echo "--- PATCH conclusion=action_required ---"
          gh api --method PATCH "repos/${{ github.repository }}/check-runs/$ID" \
            -f status=completed -f conclusion=action_required >/dev/null
          gh api "repos/${{ github.repository }}/check-runs/$ID" --jq '"after action_required: status=\(.status) conclusion=\(.conclusion)"'
